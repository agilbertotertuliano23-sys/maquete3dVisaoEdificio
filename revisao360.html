<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imagem identificada · Revisão 360°</title><style>*{box-sizing:border-box}html,body{margin:0;background:#102531;color:white;font-family:Arial,sans-serif}figure{margin:0}img{display:block;width:100%;aspect-ratio:2/1;object-fit:contain;background:#102531}figcaption{height:120px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 34px;border-top:4px solid #63d7ef}h1{font-size:26px;font-weight:500;margin:0 0 9px}p{font-size:14px;color:#b4cbd7;margin:0}strong{font-size:22px;letter-spacing:1px;white-space:nowrap}small{display:block;font-size:12px;font-weight:normal;letter-spacing:1px;color:#94dbea;text-align:right;margin-bottom:8px}@media(max-width:700px){figcaption{padding:15px;gap:12px}h1{font-size:16px}p{font-size:10px}strong{font-size:12px}small{font-size:8px}}</style></head><body><figure><img id="image" alt=""><figcaption><div><h1></h1><p></p></div><strong><small>REFERÊNCIA PARA AJUSTES</small><span></span></strong></figcaption></figure><script type="module">
import {TOUR_CATALOG} from './src/tour360Catalogo.js';
const args=new URLSearchParams(location.search),id=args.get('planta')||'AP-01',property=TOUR_CATALOG[id],room=property?.rooms.find(r=>r.id===(args.get('ambiente')||'sala'));
if(room){const code=(id+'-'+room.id).toUpperCase().replaceAll('_','-');document.querySelector('h1').textContent=property.name+' · '+room.name;document.querySelector('p').textContent='Panorama 360° · Imagem conceitual · '+room.original.replace('./','');document.querySelector('strong span').textContent=code;const img=document.querySelector('img');img.alt=property.name+' · '+room.name;img.src=room.original||room.src;window.reviewCode=code;window.reviewReady=img.decode().then(()=>true);}else{document.querySelector('h1').textContent='Imagem não encontrada';}
</script></body></html>
